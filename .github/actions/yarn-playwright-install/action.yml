name: Install playwright binaries
description: "Install playwright, cache and restore if necessary"
inputs:
  skip-install-if-cache-hit:
    description: "Skip playwright install if cache is hit. Use this for jobs that only need to check that cache exists."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Get installed Playwright version
      shell: bash
      id: playwright-version
      run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> $GITHUB_ENV

    # When skip-install-if-cache-hit is true, first check if cache exists without downloading (lookup-only mode)
    - name: Check playwright cache (lookup-only)
      if: ${{ inputs.skip-install-if-cache-hit == 'true' }}
      id: playwright-cache-check
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/Library/Caches/ms-playwright
          ~/.cache/ms-playwright
          ${{ github.workspace }}/node_modules/playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
        lookup-only: true

    # Only restore cache if not in skip mode, or if skip mode but cache check missed
    - name: Cache playwright binaries
      if: ${{ inputs.skip-install-if-cache-hit != 'true' || steps.playwright-cache-check.outputs.cache-hit != 'true' }}
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/ms-playwright
          ~/.cache/ms-playwright
          ${{ github.workspace }}/node_modules/playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

    # In default mode: run if playwright-cache missed
    # In skip mode: run if playwright-cache-check missed (but cache restore step was also skipped)
    - name: Yarn playwright install
      if: ${{ (inputs.skip-install-if-cache-hit != 'true' && steps.playwright-cache.outputs.cache-hit != 'true') || (inputs.skip-install-if-cache-hit == 'true' && steps.playwright-cache-check.outputs.cache-hit != 'true') }}
      shell: bash
      # CI-PRUPDATE-1 (t_f1ca49bb): in skip mode yarn-install only looks the node_modules cache up and restores
      # nothing, so on a playwright cache miss there is no node_modules state and `yarn playwright` fails with
      # "Couldn't find the node_modules state file" (PR Update Prepare, runs 40553347235, 40491859512).
      # Fall back to the exact pinned version through npx; browsers land in ~/.cache/ms-playwright either way.
      run: |
        # ADDRESS-timeway-201 (t_bdd3a944): ubuntu-latest is 26.04 since 2026-10-28 and Playwright 1.57 refuses
        # `install --with-deps` there ("does not support chromium on ubuntu26.04-x64", run 40661496294). Download
        # the browser without the OS-deps step first; --with-deps stays as the fallback.
        if [ -x node_modules/.bin/playwright ]; then
          PW="yarn playwright"
        else
          PW="npx --yes playwright@${PLAYWRIGHT_VERSION}"
        fi
        $PW install chromium || $PW install --with-deps
