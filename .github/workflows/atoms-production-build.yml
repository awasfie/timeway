name: Atoms production Build

on:
  workflow_call:

concurrency:
  # CI-COST-4 (t_25c20e17): CI-COST-1 rule on every non-release workflow. PR runs and non-main branch pushes
  # cancel the superseded run; main, schedule, dispatch and merge_group get a per-run group (never cancelled).
  # The group starts with the file name, not github.workflow, so a reusable workflow never shares (and
  # deadlocks on) its caller's group.
  group: atoms-production-build-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) && format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) }}

jobs:
  build:
    name: Build Atoms
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/yarn-install
      - name: Cache atoms production build
        uses: actions/cache@v4
        id: cache-atoms-build
        env:
          cache-name: atoms-build
          key-1: ${{ hashFiles('yarn.lock') }}
          key-2: ${{ hashFiles('packages/platform/atoms/**.[jt]s', 'packages/platform/atoms/**.[jt]sx', 'packages/platform/atoms/package.json', '!**/node_modules') }}
        with:
          path: |
            **/dist/**
          key: ${{ env.cache-name }}-${{ env.key-1 }}-${{ env.key-2 }}
      - name: Run build
        if: steps.cache-atoms-build.outputs.cache-hit != 'true'
        run: |
          export NODE_OPTIONS="--max_old_space_size=8192"
          rm -rf packages/platform/atoms/node_modules
          yarn install
          yarn workspace @calcom/atoms run build-npm
        shell: bash
