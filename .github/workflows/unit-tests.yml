name: Unit
on:
  workflow_call:
env:
  LINGO_DOT_DEV_API_KEY: ${{ secrets.CI_LINGO_DOT_DEV_API_KEY }}
permissions:
  contents: read
jobs:
  test:
    name: Unit
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/yarn-install
      - run: yarn prisma generate
      - run: yarn test -- --no-isolate
      # We could add different timezones here that we need to run our tests in
      - run: TZ=America/Los_Angeles VITEST_MODE=timezone yarn test -- --no-isolate
      # WC-TW-5b: host zones of the Timeway launch markets (Egypt observes DST, Saudi does not)
      - run: TZ=Africa/Cairo VITEST_MODE=timezone yarn test -- --no-isolate
      - run: TZ=Asia/Riyadh VITEST_MODE=timezone yarn test -- --no-isolate
      # WC-TW-6g: booking edge Worker unit tests (node:test, not vitest)
      - run: node --test ops/cloudflare/worker/booking-edge.test.mjs
