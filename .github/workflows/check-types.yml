name: Check types
on:
  workflow_call:
env:
  NODE_OPTIONS: --max-old-space-size=12288
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
permissions:
  contents: read
concurrency:
  # CI-COST-4 (t_25c20e17): CI-COST-1 rule on every non-release workflow. PR runs and non-main branch pushes
  # cancel the superseded run; main, schedule, dispatch and merge_group get a per-run group (never cancelled).
  # The group starts with the file name, not github.workflow, so a reusable workflow never shares (and
  # deadlocks on) its caller's group.
  group: check-types-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) && format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) }}

jobs:
  check-types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/yarn-install
      - name: Show info
        run: node -e "console.log(require('v8').getHeapStatistics())"
      - name: Configure TSC problem matcher
        run: |
          echo "::remove-matcher owner=tsc::"
          echo "::add-matcher::.github/matchers/tsc-absolute.json"
      - run: yarn type-check:ci
