name: Lint
on:
  workflow_call:
permissions:
  actions: write
  contents: read
concurrency:
  # CI-COST-4 (t_25c20e17): CI-COST-1 rule on every non-release workflow. PR runs and non-main branch pushes
  # cancel the superseded run; main, schedule, dispatch and merge_group get a per-run group (never cancelled).
  # The group starts with the file name, not github.workflow, so a reusable workflow never shares (and
  # deadlocks on) its caller's group.
  group: lint-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) && format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) }}

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/yarn-install
      - name: Run Lint
        run: yarn lint

  registry-refs:
    # WC-TW-7e / D-R74 D2: no Docker Hub anywhere in CI config; nothing is allowlisted.
    name: No Docker Hub references
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .github
      - name: Fail on Docker Hub references under .github
        # The [.] class keeps this pattern from matching its own text.
        run: |
          if grep -rnIiE 'docker[.]io|docker[_-]?hub' .github; then
            echo "::error::Docker Hub reference found under .github (D-R74 D2: GHCR only)"
            exit 1
          fi
          echo "no Docker Hub references under .github"
