name: Security scan
# t_4420b652 SEC-BASELINE-timeway: Semgrep SAST + Trivy dependency/image scan (CodeQL lives in codeql.yml).
#   semgrep      p/javascript + p/typescript, ERROR severity, fails the run on any finding.
#   trivy-deps   yarn.lock + Dockerfile, CRITICAL with a fix available fails the run.
#   trivy-image  builds the production image and scans it (CRITICAL with fix fails); weekly + dispatch only,
#                PRs that touch the Dockerfile already get the same image gate in docker-migrate-job.yml.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']  # CI-COST-3
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # semgrep 1.95 imports pkg_resources; Python 3.12 runners no longer ship setuptools.
      - run: pip install semgrep==1.95.0 'setuptools<81'
      - name: semgrep (ERROR findings fail)
        run: >-
          semgrep scan --config p/javascript --config p/typescript --severity ERROR --error --metrics off
          --exclude node_modules --exclude '*.test.ts' --exclude '*.spec.ts' --exclude '**/__tests__/**'
          --exclude '**/tests/**' --exclude '**/playwright/**' .

  trivy-deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: trivy fs yarn.lock (CRITICAL with fix fails)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs --scanners vuln --severity CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress /src/yarn.lock
      - name: trivy config Dockerfile (report only)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" config --severity HIGH,CRITICAL \
            --exit-code 0 --no-progress /src/Dockerfile

  trivy-image:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMG: timeway-secscan:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk for the image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
      - name: Build image
        run: |
          docker build -t "$IMG" \
            --build-arg NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000 \
            --build-arg NEXT_PUBLIC_LICENSE_CONSENT=agree \
            --build-arg CALCOM_TELEMETRY_DISABLED=1 .
      - name: trivy image (CRITICAL with fix fails)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMG"
