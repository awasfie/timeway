name: Cron - monthlyDigestEmail

on:
  # "Scheduled workflows run on the latest commit on the default or base branch."
  # — https://docs.github.com/en/actions/learn-github-actions/events-that-trigger-workflows#schedule
  schedule:
    # Runs on the 28th, 29th, 30th and 31st of every month (see https://crontab.guru)
    - cron: "59 23 28-31 * *"
concurrency:
  # CI-COST-4 (t_25c20e17): CI-COST-1 rule on every non-release workflow. PR runs and non-main branch pushes
  # cancel the superseded run; main, schedule, dispatch and merge_group get a per-run group (never cancelled).
  # The group starts with the file name, not github.workflow, so a reusable workflow never shares (and
  # deadlocks on) its caller's group.
  group: cron-monthlyDigestEmail-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) && format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) }}

jobs:
  cron-monthlyDigestEmail:
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_API_KEY: ${{ secrets.CRON_API_KEY }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check if today is the last day of the month
        id: check-last-day
        run: |
          LAST_DAY=$(date -d tomorrow +%d)
          if [ "$LAST_DAY" == "01" ]; then
            echo "is_last_day=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_last_day=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cURL request
        if: ${{ env.APP_URL && env.CRON_API_KEY && steps.check-last-day.outputs.is_last_day == 'true' }}
        run: |
          curl ${{ secrets.APP_URL }}/api/cron/monthlyDigestEmail \
            -X POST \
            -H 'content-type: application/json' \
            -H 'authorization: ${{ secrets.CRON_API_KEY }}' \
            --fail
