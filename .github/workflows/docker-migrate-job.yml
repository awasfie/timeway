name: Docker image + migrate job
# TW-T9.2e (WC-PE-6 timeway, CC-89 "no owner URL in any runtime env"): build the production image, then prove
#  1) the image carries no database URL,
#  2) the app container (DATABASE_URL = timeway_app only) refuses to start while migrations are pending,
#  3) the one-shot job `scripts/migrate.sh deploy` applies every migration as timeway_owner,
#  4) the app then starts and serves with only the timeway_app URL; every app connection is timeway_app.
# Throwaway Postgres on a docker network only; no secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]  # CI-COST-2: ready_for_review re-runs the full suite on the head SHA
    paths:
      - "Dockerfile"
      - "scripts/start.sh"
      - "scripts/migrate.sh"
      - ".github/workflows/docker-migrate-job.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # CI-COST-1 (t_2d660e6e): a newer push to the same PR or non-main branch cancels the superseded run.
  # main, tags, schedule, workflow_dispatch and merge_group get a per-run group (github.run_id): never queued
  # behind another run, never cancelled.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) && format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) }}

jobs:
  docker-migrate-job:
    # CI-COST-2 (t_9b638c09): full job — runs on ready PRs, main, merge_group, schedule, dispatch; not on drafts or branch pushes.
    if: ${{ github.event.pull_request.draft != true && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    name: docker-migrate-job
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMG: timeway:ci
      NET: tw-ci
      ADMIN_URL: postgresql://postgres:postgres@tw-db:5432/timeway
      OWNER_URL: postgresql://timeway_owner:ci-owner-only@tw-db:5432/timeway
      APP_URL: postgresql://timeway_app:ci-app-only@tw-db:5432/timeway
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for the image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - name: Build image
        run: |
          docker build -t "$IMG" \
            --build-arg NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000 \
            --build-arg NEXT_PUBLIC_LICENSE_CONSENT=agree \
            --build-arg CALCOM_TELEMETRY_DISABLED=1 .
          docker image ls "$IMG"
      - name: 1) image carries no database URL
        run: |
          docker image inspect "$IMG" --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1 | tee env-names.txt
          if grep -E '^(DATABASE_URL|DATABASE_DIRECT_URL|TIMEWAY_MIGRATE_DATABASE_URL)$' env-names.txt; then
            echo "FAIL: database URL baked into the image"; exit 1
          fi
      - name: 1b) runtime image has no npm, no -dev packages, 0 CRITICAL with fix (IMGSCAN-A1, CC-93)
        run: |
          docker run --rm --entrypoint sh "$IMG" -c 'for b in npm npx; do if command -v $b; then echo "FAIL: $b in runtime"; exit 1; fi; done; dpkg-query -W -f="\${Package}\n" | grep -E -- "-dev$|^imagemagick|^libmagick|^(gcc|g\+\+|cpp)(-[0-9]+)?$|^make$" && exit 1; echo "no npm, no -dev/toolchain packages"'
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMG"
      - name: Throwaway Postgres with prod-shaped roles
        run: |
          docker network create "$NET"
          docker run -d --name tw-db --network "$NET" -e POSTGRES_PASSWORD=postgres postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          for i in $(seq 1 60); do docker exec tw-db pg_isready -U postgres -q && break; sleep 1; done
          sleep 2
          P="docker exec -i tw-db psql -U postgres -v ON_ERROR_STOP=1 -X"
          $P -d postgres -c "create role timeway_owner login password 'ci-owner-only' nosuperuser nobypassrls" \
            -c "create role timeway_app login password 'ci-app-only' nosuperuser nobypassrls" \
            -c "create database timeway owner timeway_owner"
          $P -d timeway -c "alter schema public owner to timeway_owner" \
            -c "grant usage on schema public to timeway_app" \
            -c "alter default privileges for role timeway_owner in schema public grant select, insert, update, delete on tables to timeway_app" \
            -c "alter default privileges for role timeway_owner in schema public grant usage, select, update on sequences to timeway_app"
      - name: 2) app refuses to start while migrations are pending
        run: |
          set +e
          timeout 300 docker run --rm --network "$NET" \
            -e DATABASE_URL="$APP_URL" -e NEXTAUTH_SECRET=ci-only -e CALENDSO_ENCRYPTION_KEY=0zfLtY99wjeLnsM7qsa8xsT+Q0oSgnOL \
            "$IMG" > pre.log 2>&1
          rc=$?
          set -e
          tail -30 pre.log
          echo "app exit before migrate: $rc"
          [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] || { echo "FAIL: app did not refuse"; exit 1; }
          grep -q "schema is not up to date" pre.log
          if grep -q "postgresql://" pre.log; then echo "FAIL: URL in log"; exit 1; fi
      - name: 3) one-shot migrate job as timeway_owner (URL over stdin, not argv)
        run: |
          printf 'TIMEWAY_MIGRATE_DATABASE_URL=%s\n' "$OWNER_URL" \
            | docker run --rm -i --network "$NET" --env-file /dev/stdin "$IMG" /calcom/scripts/migrate.sh deploy 2>&1 | tee migrate.log
          grep -q "result exit=0" migrate.log
          if grep -q "postgresql://" migrate.log; then echo "FAIL: URL in log"; exit 1; fi
          repo=$(ls packages/prisma/migrations/*/migration.sql | wc -l | tr -d ' ')
          Q="docker exec tw-db psql -U postgres -d timeway -XAt -c"
          applied=$($Q "select count(*) from _prisma_migrations where finished_at is not null and rolled_back_at is null")
          not_owner=$($Q "select count(*) from pg_tables where schemaname='public' and tableowner <> 'timeway_owner'")
          echo "migrations in repo=$repo applied=$applied tables_not_owned_by_timeway_owner=$not_owner"
          if [ "$repo" != "$applied" ] || [ "$not_owner" != "0" ]; then echo "FAIL: applied/ownership mismatch"; exit 1; fi
          printf 'TIMEWAY_MIGRATE_DATABASE_URL=%s\n' "$OWNER_URL" \
            | docker run --rm -i --network "$NET" --env-file /dev/stdin "$IMG" /calcom/scripts/migrate.sh deploy 2>&1 | tee migrate2.log
          grep -q "No pending migrations" migrate2.log
          grep -q "result exit=0" migrate2.log
      - name: 4) app starts with only DATABASE_URL = timeway_app
        run: |
          docker run -d --name tw-app --network "$NET" -p 3000:3000 \
            -e DATABASE_URL="$APP_URL" -e NEXTAUTH_SECRET=ci-only -e CALENDSO_ENCRYPTION_KEY=0zfLtY99wjeLnsM7qsa8xsT+Q0oSgnOL \
            "$IMG"
          echo "runtime DB env names:"; docker exec tw-app sh -c 'env | cut -d= -f1 | grep -E "DATABASE|MIGRATE" | sort'
          [ "$(docker exec tw-app sh -c 'env | cut -d= -f1 | grep -cE "DATABASE|MIGRATE"')" = "1" ]
          docker exec tw-app sh -c 'node -e "console.log(\"runtime DATABASE_URL user:\", new URL(process.env.DATABASE_URL).username)"'
          ok=""
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/auth/login || true)
            if [ "$code" = "200" ] || [ "$code" = "307" ]; then ok=$code; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' tw-app)" != "true" ]; then break; fi
            sleep 5
          done
          docker logs tw-app 2>&1 | grep -E "\[migrate\]|\[start\]|migrations|Database schema|📲|Ready|Error" | head -40
          echo "GET /auth/login -> ${ok:-none}"
          [ -n "$ok" ]
          Q="docker exec tw-db psql -U postgres -d timeway -XAt -c"
          echo "app connections by role:"; $Q "select usename, count(*) from pg_stat_activity where datname='timeway' and usename is not null group by 1"
          [ "$($Q "select count(*) from pg_stat_activity where datname='timeway' and usename not in ('timeway_app','postgres')")" = "0" ]
          echo "apps seeded as timeway_app: $($Q 'select count(*) from "App"')"
      - name: Logs on failure
        if: failure()
        run: docker logs tw-app 2>&1 | tail -100 || true
      - name: Cleanup
        if: always()
        run: |
          docker rm -f tw-app tw-db >/dev/null 2>&1 || true
          docker network rm "$NET" >/dev/null 2>&1 || true

  # CI-COST-2 (t_9b638c09): one honest check per run. On a ready PR, main, merge_group, schedule or dispatch it
  # fails unless every full job concluded `success` (a job skipped by `if:` fails it). It is skipped on drafts and
  # branch pushes, and its name carries the event, so a skipped push/draft run never shadows the PR result.
  full-suite-gate:
    name: Full suite gate (${{ github.event_name }})
    needs: [docker-migrate-job]
    if: ${{ always() && github.event.pull_request.draft != true && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every full job ran and passed on this head
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(",")')
          if [ -n "$bad" ]; then echo "::error::full suite incomplete on $HEAD (not success: $bad)"; exit 1; fi
          echo "full suite green on $HEAD"
