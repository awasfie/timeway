name: Cron - mark stale for inactive issues

permissions:
  issues: write
  pull-requests: write

on:
  # "Scheduled workflows run on the latest commit on the default or base branch."
  # — https://docs.github.com/en/actions/learn-github-actions/events-that-trigger-workflows#schedule
  schedule:
    # Runs "At 00:00." every day (see https://crontab.guru)
    - cron: "0 0 * * *"
  workflow_dispatch:
concurrency:
  # CI-COST-4 (t_25c20e17): CI-COST-1 rule on every non-release workflow. PR runs and non-main branch pushes
  # cancel the superseded run; main, schedule, dispatch and merge_group get a per-run group (never cancelled).
  # The group starts with the file name, not github.workflow, so a reusable workflow never shares (and
  # deadlocks on) its caller's group.
  group: cron-stale-issue-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) && format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) }}

jobs:
  stale:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@v7
        with:
          days-before-close: -1
          days-before-issue-stale: 60
          days-before-issue-close: -1
          days-before-pr-stale: 7
          days-before-pr-close: 14
          stale-pr-message: "This PR has been marked as stale due to inactivity. If you're still working on it or need any help, please let us know or update the PR to keep it active."
          close-pr-message: "This PR has been closed due to inactivity. Please feel free to reopen it if you'd like to continue the work."
          operations-per-run: 100
