name: Cron - scheduleSMSReminders

on:
  # "Scheduled workflows run on the latest commit on the default or base branch."
  # — https://docs.github.com/en/actions/learn-github-actions/events-that-trigger-workflows#schedule
  schedule:
    # Runs "At every 15th minute." (see https://crontab.guru)
    - cron: "*/15 * * * *"
concurrency:
  # CI-COST-4 (t_25c20e17): CI-COST-1 rule on every non-release workflow. PR runs and non-main branch pushes
  # cancel the superseded run; main, schedule, dispatch and merge_group get a per-run group (never cancelled).
  # The group starts with the file name, not github.workflow, so a reusable workflow never shares (and
  # deadlocks on) its caller's group.
  group: cron-scheduleSMSReminders-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) && format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) }}

jobs:
  cron-scheduleSMSReminders:
    env:
      APP_URL_US: ${{ vars.APP_URL_US }}
      APP_URL_EU: ${{ vars.APP_URL_EU }}
      CRON_API_KEY_US: ${{ secrets.CRON_API_KEY }}
      CRON_API_KEY_EU: ${{ secrets.CRON_API_KEY_EU }}
    runs-on: ubuntu-24.04
    steps:
      - name: cURL request EU
        if: ${{ env.APP_URL_EU && env.CRON_API_KEY_EU }}
        run: |
          curl ${{ env.APP_URL_EU }}/api/cron/workflows/scheduleSMSReminders \
            -X POST \
            -H 'content-type: application/json' \
            -H 'authorization: ${{ env.CRON_API_KEY_EU }}' \
            -sSf
      - name: cURL request US
        if: ${{ env.APP_URL_US && env.CRON_API_KEY_US }}
        run: |
          curl ${{ env.APP_URL_US }}/api/cron/workflows/scheduleSMSReminders \
            -X POST \
            -H 'content-type: application/json' \
            -H 'authorization: ${{ env.CRON_API_KEY_US }}' \
            -sSf
