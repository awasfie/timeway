name: "PR Welcome Bot"

on:
  pull_request_target:
    types:
      - opened

permissions:
  pull-requests: write

concurrency:
  # CI-COST-4 (t_25c20e17): CI-COST-1 rule on every non-release workflow. PR runs and non-main branch pushes
  # cancel the superseded run; main, schedule, dispatch and merge_group get a per-run group (never cancelled).
  # The group starts with the file name, not github.workflow, so a reusable workflow never shares (and
  # deadlocks on) its caller's group.
  group: pr-welcome-bot-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) && format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main')) }}

jobs:
  welcome:
    name: Welcome new contributors
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            // Skip PRs from org members and bots
            if (
              ["MEMBER", "OWNER", "COLLABORATOR"].includes(pr.author_association) ||
              pr.user.type === "Bot"
            ) {
              console.log(`Skipping — author association: ${pr.author_association}, type: ${pr.user.type}`);
              return;
            }

            const body = [
              `Welcome to **Cal.diy**, @${pr.user.login}! Thanks for opening this pull request.`,
              "",
              "A few things to keep in mind:",
              "",
              "- **This is Cal.diy, not Cal.com.** Cal.diy is a community-driven, fully open-source fork of Cal.com licensed under MIT. Your changes here will be part of Cal.diy — they will **not** be deployed to the Cal.com production app.",
              "- Please review our [Contributing Guidelines](https://github.com/calcom/cal.diy/blob/main/CONTRIBUTING.md) if you haven't already.",
              "- Make sure your PR title follows the [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/) format.",
              "",
              "A maintainer will review your PR soon. Thanks for contributing!",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
