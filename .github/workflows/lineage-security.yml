name: Lineage security (CC-63)
# WC-TW-1: fail on any downgrade below the patched floors, or regression of the lineage auth/XSS fixes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage-floor:
    name: Lineage floor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/security/lineage-floor.mjs
