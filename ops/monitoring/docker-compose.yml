# R1-TW-MONITORING (t_1ee20514): blackbox exporter next to g3-prometheus on 62.171.141.202.
# Own compose project (tw-monitoring) in /opt/g3-observability/timeway so the tracked g3-observability stack is untouched.
services:
  blackbox:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    container_name: g3-blackbox-timeway
    restart: unless-stopped
    command: ['--config.file=/etc/blackbox/blackbox.yml']
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - coolify

networks:
  coolify:
    external: true
